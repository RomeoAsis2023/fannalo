<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories — Fannalo</title>
  <meta name="description" content="View and share ephemeral stories with your fans on Fannalo.">
  <meta property="og:title" content="Stories — Fannalo">
  <meta property="og:description" content="View and share ephemeral stories that disappear after 24 hours on Fannalo.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/pages/stories.html">
  <meta property="og:image" content="/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="/pages/stories.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/preload.js"></script>
</head>
<body>
  <div class="bg-noise"></div>

  <div class="main-content" id="app">
    <div class="container" style="max-width:680px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h1 style="font-size:22px;font-weight:700;">Stories</h1>
        <button id="createStoryBtn" class="btn btn-primary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Story
        </button>
      </div>

      <div id="storyFeed" class="reveal" style="display:flex;gap:12px;overflow-x:auto;padding:12px 0;margin-bottom:24px;scrollbar-width:none;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;">
          <div style="width:64px;height:64px;border-radius:50%;padding:3px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;">
            <div style="width:56px;height:56px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent);">+</div>
          </div>
          <div style="font-size:11px;color:var(--text-muted);">Your Story</div>
        </div>
        <div id="storyRings" style="display:flex;gap:12px;"></div>
      </div>

      <div id="createStorySection" class="reveal" style="display:none;">
        <div class="card" style="padding:24px;">
          <h2 style="font-size:16px;font-weight:600;margin-bottom:12px;">Create a Story</h2>
          <textarea class="textarea" id="storyText" placeholder="Add text overlay..." style="min-height:60px;margin-bottom:12px;"></textarea>
          <div style="display:flex;gap:10px;">
            <button id="uploadPhotoStory" class="btn btn-secondary">📸 Photo</button>
            <button id="uploadVideoStory" class="btn btn-secondary">🎥 Video</button>
            <input type="file" id="storyFileInput" accept="image/*,video/*" style="display:none;">
          </div>
          <button id="publishStoryBtn" class="btn btn-primary" style="width:100%;margin-top:12px;justify-content:center;">Publish Story</button>
        </div>
      </div>

      <div id="storyList" class="reveal stagger" style="display:flex;flex-direction:column;gap:8px;">
        <div style="text-align:center;padding:40px;color:var(--text-muted);">No stories available</div>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script type="module">
    import { initPage, showToast } from '../assets/js/app.js';

    let app = null;
    let selectedFile = null;
    let storyGroups = [];

    async function loadStories() {
      const groups = await app.stories.loadFeed();
      storyGroups = groups;
      const container = document.getElementById('storyRings');
      container.innerHTML = '';
      groups.forEach(g => {
        const ring = app.stories.renderStoryRing(g);
        ring.addEventListener('click', () => openStoryViewer(g));
        container.appendChild(ring);
      });

      const list = document.getElementById('storyList');
      if (groups.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:14px;">No stories today. Be the first to post one!</div>';
      } else {
        list.innerHTML = groups.flatMap(g => g.stories).map(s => `
          <div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;">
            <div class="avatar avatar-sm" style="background:var(--gradient-1);font-size:10px;width:28px;height:28px;">${(s.author?.displayName || '?')[0]}</div>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:500;">${s.author?.displayName || 'Unknown'}</div>
              <div style="font-size:11px;color:var(--text-muted);">${app.stories._timeAgo(s.createdAt)} · ${s.views?.length || 0} views</div>
            </div>
            <button class="btn btn-ghost btn-sm view-story-btn" data-story-id="${s.id}">View</button>
          </div>
        `).join('');
      }
    }

    function openStoryViewer(group) {
      let idx = 0;
      const show = () => {
        if (idx >= group.stories.length) return;
        const story = group.stories[idx];
        app.stories.renderStoryViewer(story, () => { idx++; show(); }, () => { if (idx > 0) idx--; show(); }, () => loadStories());
      };
      show();
    }

    app = await initPage(true);
    if (app) {
      await loadStories();

      document.getElementById('createStoryBtn').addEventListener('click', () => {
        const section = document.getElementById('createStorySection');
        section.style.display = section.style.display === 'none' ? 'block' : 'none';
      });

      document.getElementById('uploadPhotoStory').addEventListener('click', () => {
        const input = document.getElementById('storyFileInput');
        input.accept = 'image/*'; input.click();
      });

      document.getElementById('uploadVideoStory').addEventListener('click', () => {
        const input = document.getElementById('storyFileInput');
        input.accept = 'video/*'; input.click();
      });

      document.getElementById('storyFileInput').addEventListener('change', (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) showToast(`Selected: ${selectedFile.name}`, 'info');
      });

      document.getElementById('publishStoryBtn').addEventListener('click', async () => {
        const text = document.getElementById('storyText').value.trim();
        if (!selectedFile && !text) { showToast('Add a photo/video or text', 'error'); return; }
        try {
          const mediaType = selectedFile?.type.startsWith('video') ? 'video' : 'image';
          const mediaURL = selectedFile ? URL.createObjectURL(selectedFile) : '';
          await app.stories.create(mediaURL, text, mediaType);
          showToast('Story published!', 'success');
          document.getElementById('createStorySection').style.display = 'none';
          document.getElementById('storyText').value = '';
          selectedFile = null;
          loadStories();
        } catch (e) {
          showToast(e.message, 'error');
        }
      });
    }
  </script>
</body>
</html>
