<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Fannalo</title>
  <meta name="description" content="Log in to your Fannalo account to access your feed, messages, and creator tools.">
  <meta property="og:title" content="Log In — Fannalo">
  <meta property="og:description" content="Log in to your Fannalo account and access your decentralized creator network.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/pages/login.html">
  <meta property="og:image" content="/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="/pages/login.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/preload.js"></script>
</head>
<body>
  <div class="bg-noise"></div>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="position:fixed;top:-20%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,255,0.1) 0%,transparent 70%);pointer-events:none;"></div>
    <div style="position:fixed;bottom:-20%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,0.1) 0%,transparent 70%);pointer-events:none;"></div>

    <div class="card" style="max-width:420px;width:100%;padding:32px;">
      <div style="text-align:center;margin-bottom:28px;">
        <a href="../index.html" style="display:inline-block;margin-bottom:8px;"><img src="../assets/img/full_logo.png" alt="Fannalo" style="height:32px;"></a>
        <p style="color:var(--text-secondary);font-size:14px;">Welcome back</p>
      </div>

      <form id="loginForm">
        <div style="margin-bottom:16px;">
          <label class="input-label" for="username">Username or Email</label>
          <input type="text" id="username" class="input" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div style="margin-bottom:20px;">
          <label class="input-label" for="password">Password</label>
          <input type="password" id="password" class="input" placeholder="Enter your password" required autocomplete="current-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:15px;">
          Log In
        </button>
      </form>

      <div style="margin-top:16px;text-align:center;">
        <button id="passkeyBtn" class="btn btn-secondary" style="width:100%;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
          Sign in with Passkey
        </button>
      </div>

      <div style="margin-top:20px;text-align:center;font-size:13px;">
        <a href="register.html" style="color:var(--accent);">Create an account</a>
        <span style="color:var(--text-muted);margin:0 8px;">·</span>
        <a href="forgot-password.html" style="color:var(--text-muted);">Forgot password?</a>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script type="module">
    import { initApp } from '../assets/js/app.js';

    function validate() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username) { showToast('Enter your username', 'error'); return false; }
      if (!password) { showToast('Enter your password', 'error'); return false; }
      if (password.length < 8) { showToast('Password must be at least 8 characters', 'error'); return false; }
      return true;
    }

    async function handleLogin(e) {
      e.preventDefault();
      if (!validate()) return;
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const orig = submitBtn.innerHTML;
      submitBtn.innerHTML = 'Logging in...'; submitBtn.disabled = true;

      try {
        const { auth } = await initApp();
        await auth.login(username, password);
        showToast('Login successful!', 'success');
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'feed.html';
        setTimeout(() => window.location.href = redirect, 800);
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        submitBtn.innerHTML = orig; submitBtn.disabled = false;
      }
    }

    async function handlePasskeyLogin() {
      try {
        const { auth } = await initApp();
        await auth.loginWithPasskey();
        showToast('Passkey login successful!', 'success');
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'feed.html';
        setTimeout(() => window.location.href = redirect, 800);
      } catch (err) {
        showToast(err.message || 'Passkey login failed', 'error');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    document.getElementById('passkeyBtn').addEventListener('click', handlePasskeyLogin);

    function showToast(message, type = 'info', duration = 4000) {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      const colors = { success: 'var(--success)', error: 'var(--danger)', info: 'var(--accent)', warning: 'var(--warning)' };
      t.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;width:100%;">
          <div style="width:8px;height:8px;border-radius:50%;background:${colors[type] || colors.info};flex-shrink:0;"></div>
          <span style="flex:1;font-size:14px;">${message}</span>
          <button onclick="this.closest('.toast').remove()" style="background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;">&times;</button>
        </div>
      `;
      c.appendChild(t);
      setTimeout(() => t.remove(), duration);
    }
  </script>
</body>
</html>
