<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Fannalo</title>
  <meta name="description" content="View your Fannalo events and schedule in monthly calendar view.">
  <meta property="og:title" content="Calendar — Fannalo">
  <meta property="og:description" content="View your Fannalo events and schedule in an interactive monthly calendar view.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://faney.app/pages/calendar.html">
  <meta property="og:image" content="https://faney.app/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://faney.app/pages/calendar.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/preload.js"></script>
</head>
<body>
  <div class="bg-noise"></div>

  <div class="main-content" id="app">
    <div class="container" style="max-width:800px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <h1 style="font-size:22px;font-weight:700;">Calendar</h1>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="prevMonth" class="btn btn-ghost btn-icon">&larr;</button>
          <span id="monthYear" style="font-size:16px;font-weight:600;min-width:160px;text-align:center;"></span>
          <button id="nextMonth" class="btn btn-ghost btn-icon">&rarr;</button>
        </div>
      </div>

      <div class="card" style="overflow:hidden;">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);">
          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div style="padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--text-muted);">${d}</div>`).join('')}
        </div>
        <div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);"></div>
      </div>

      <div style="margin-top:24px;">
        <h2 style="font-size:16px;font-weight:600;margin-bottom:12px;">Events This Month</h2>
        <div id="monthEvents"></div>
      </div>
    </div>
  </div>

  <div id="modalContainer"></div>

  <script type="module">
    import { initPage, showToast } from '../assets/js/app.js';

    let app = null;
    let currentDate = new Date();
    let cachedEvents = [];

    async function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('monthYear').textContent =
        new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const start = new Date(year, month, 1).getTime();
      const end = new Date(year, month, daysInMonth, 23, 59, 59).getTime();

      const allEvents = await app.events.getCalendarEvents(start, end);
      cachedEvents = allEvents;

      const today = new Date();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:4px;min-height:80px;';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dayEvents = allEvents.filter(e => {
          const d = new Date(e.date);
          return d.getDate() === day && d.getMonth() === month && d.getFullYear() === year;
        });

        const cell = app.events.renderCalendarCell(day, dayEvents);
        if (date.toDateString() === today.toDateString()) {
          cell.style.background = 'var(--accent-glow)';
          cell.style.borderRadius = 'var(--radius-sm)';
        }
        grid.appendChild(cell);
      }

      renderMonthEvents(allEvents);
    }

    function renderMonthEvents(events) {
      const container = document.getElementById('monthEvents');
      if (!events || events.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:14px;">No events this month</div>';
        return;
      }

      container.innerHTML = '';
      events.sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(e => {
        const date = new Date(e.date);
        const card = document.createElement('div');
        card.className = 'card';
        card.style.cssText = 'display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:8px;cursor:pointer;';
        card.innerHTML = `
          <div style="text-align:center;flex-shrink:0;width:40px;">
            <div style="font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;">${date.toLocaleString('default',{month:'short'})}</div>
            <div style="font-size:18px;font-weight:700;">${date.getDate()}</div>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:500;">${e.title}</div>
            <div style="font-size:12px;color:var(--text-muted);">
              ${date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
              ${e.location ? ` · ${e.location}` : ''}
            </div>
          </div>
          ${e.isPremium ? '<span class="badge badge-accent" style="font-size:10px;">Premium</span>' : ''}
        `;
        container.appendChild(card);
      });
    }

    app = await initPage(true);
    if (app) {
      await renderCalendar();

      document.getElementById('prevMonth').addEventListener('click', async () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        await renderCalendar();
      });

      document.getElementById('nextMonth').addEventListener('click', async () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        await renderCalendar();
      });
    }
  </script>
</body>
</html>
