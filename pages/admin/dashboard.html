<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Fannalo</title>
  <meta name="description" content="Fannalo admin panel to manage users, content, and platform settings.">
  <meta property="og:title" content="Admin Dashboard — Fannalo">
  <meta property="og:description" content="Fannalo admin panel to manage users, content, and platform settings.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://faney.app/pages/admin/dashboard.html">
  <meta property="og:image" content="https://faney.app/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://faney.app/pages/admin/dashboard.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo" style="gap:4px;">
        <img src="../../assets/img/full_logo.png" alt="Fannalo" style="height:20px;"><span style="font-size:12px;background:var(--accent);color:#000;padding:2px 6px;border-radius:4px;-webkit-text-fill-color:#000;">admin</span>
      </div>

      <div class="admin-nav-section">Main</div>
      <a href="dashboard.html" class="admin-nav-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="users.html" class="admin-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Users</span>
      </a>
      <a href="../feed.html" class="admin-nav-link" style="margin-top:auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Back to App</span>
      </a>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>Dashboard</h1>
        <div style="display:flex;gap:10px;align-items:center;">
          <span id="peerCount" style="font-size:13px;color:var(--text-muted);">🌐 0 peers online</span>
          <button id="refreshBtn" class="btn btn-secondary btn-sm">Refresh</button>
        </div>
      </div>

      <div id="statsGrid" class="admin-grid">
        <div class="admin-stat">
          <div style="font-size:24px;margin-bottom:8px;">👤</div>
          <div class="admin-stat-value" id="totalUsers">—</div>
          <div class="admin-stat-label">Total Users</div>
        </div>
        <div class="admin-stat">
          <div style="font-size:24px;margin-bottom:8px;">📝</div>
          <div class="admin-stat-value" id="totalPosts">—</div>
          <div class="admin-stat-label">Total Posts</div>
        </div>
        <div class="admin-stat">
          <div style="font-size:24px;margin-bottom:8px;">⭐</div>
          <div class="admin-stat-value" id="activeSubs">—</div>
          <div class="admin-stat-label">Active Subscriptions</div>
        </div>
        <div class="admin-stat">
          <div style="font-size:24px;margin-bottom:8px;">💰</div>
          <div class="admin-stat-value" id="totalCredits">—</div>
          <div class="admin-stat-label">Total Credits</div>
        </div>
        <div class="admin-stat">
          <div style="font-size:24px;margin-bottom:8px;">📈</div>
          <div class="admin-stat-value" id="totalEarnings">—</div>
          <div class="admin-stat-label">Total Earnings</div>
        </div>
        <div class="admin-stat">
          <div style="font-size:24px;margin-bottom:8px;">⚡</div>
          <div class="admin-stat-value" id="superPeers">—</div>
          <div class="admin-stat-label">Super Peers</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="admin-card">
          <div class="admin-card-header">
            <h3 style="font-size:15px;font-weight:600;">Recent Users</h3>
          </div>
          <div class="admin-card-body" style="padding:0;">
            <table class="admin-table">
              <thead>
                <tr><th>User</th><th>Role</th><th>Joined</th></tr>
              </thead>
              <tbody id="recentUsersTable">
                <tr><td colspan="3" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-header">
            <h3 style="font-size:15px;font-weight:600;">Recent Posts</h3>
          </div>
          <div class="admin-card-body" style="padding:0;">
            <table class="admin-table">
              <thead>
                <tr><th>Content</th><th>Author</th><th>Date</th></tr>
              </thead>
              <tbody id="recentPostsTable">
                <tr><td colspan="3" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../assets/js/core/preload.js"></script>
  <script src="../../assets/js/admin/dashboard.js"></script>
  <script type="module">
    import { initApp, showToast } from '../../assets/js/app.js';

    async function loadDashboard() {
      const app = await initApp();
      const stats = await app.admin.getDashboardStats();

      document.getElementById('totalUsers').textContent = stats.total.users;
      document.getElementById('totalPosts').textContent = stats.total.posts;
      document.getElementById('activeSubs').textContent = stats.total.subscriptions;
      document.getElementById('totalCredits').textContent = app.admin._formatCredits(stats.financial.totalCredits);
      document.getElementById('totalEarnings').textContent = app.admin._formatCredits(stats.financial.totalEarnings);
      document.getElementById('superPeers').textContent = stats.network.superPeers;
      document.getElementById('peerCount').textContent = `🌐 ${stats.network.onlinePeers || 0} peers online`;

      const usersTbody = document.getElementById('recentUsersTable');
      usersTbody.innerHTML = stats.recentUsers.map(u => `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="avatar avatar-sm" style="background:var(--gradient-1);font-size:10px;width:28px;height:28px;">${(u.displayName || '?')[0]}</div>
              <div>
                <div style="font-size:13px;font-weight:500;">${u.displayName || u.username}</div>
                <div style="font-size:11px;color:var(--text-muted);">@${u.username}</div>
              </div>
            </div>
          </td>
          <td><span class="badge ${u.role === 'admin' ? 'badge-accent' : u.isCreator ? 'badge-success' : ''}" style="font-size:11px;">${u.role === 'admin' ? 'Admin' : u.isCreator ? 'Creator' : 'User'}</span></td>
          <td style="font-size:12px;color:var(--text-muted);">${new Date(u.createdAt).toLocaleDateString()}</td>
        </tr>
      `).join('');

      const postsTbody = document.getElementById('recentPostsTable');
      postsTbody.innerHTML = stats.recentPosts.map(p => `
        <tr>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;">${p.content?.substring(0, 60) || '(media post)'}</td>
          <td style="font-size:12px;">${(p.authorId || 'unknown').substring(0, 8)}...</td>
          <td style="font-size:12px;color:var(--text-muted);">${new Date(p.createdAt).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    await loadDashboard();
    document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
  </script>
</body>
</html>
