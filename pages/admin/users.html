<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — Fannalo Admin</title>
  <meta name="description" content="Manage Fannalo users from the admin panel.">
  <meta property="og:title" content="User Management — Fannalo Admin">
  <meta property="og:description" content="Manage Fannalo users, ban/unban accounts, and review reports from the admin panel.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://faney.app/pages/admin/users.html">
  <meta property="og:image" content="https://faney.app/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://faney.app/pages/admin/users.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo" style="gap:4px;">
        <img src="../../assets/img/full_logo.png" alt="Fannalo" style="height:20px;"><span style="font-size:12px;background:var(--accent);color:#000;padding:2px 6px;border-radius:4px;-webkit-text-fill-color:#000;">admin</span>
      </div>
      <div class="admin-nav-section">Main</div>
      <a href="dashboard.html" class="admin-nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="users.html" class="admin-nav-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Users</span>
      </a>
      <a href="../feed.html" class="admin-nav-link" style="margin-top:auto;">
        <span>Back to App</span>
      </a>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>User Management</h1>
        <div style="display:flex;gap:10px;">
          <input type="text" id="searchUser" class="input" placeholder="Search users..." style="max-width:240px;">
          <button id="refreshUsers" class="btn btn-secondary btn-sm">Refresh</button>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-body" style="padding:0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Role</th>
                <th>Credits</th>
                <th>Earnings</th>
                <th>Followers</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:40px;">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="toastContainer"></div>

  <script src="../../assets/js/core/preload.js"></script>
  <script src="../../assets/js/admin/dashboard.js"></script>
  <script type="module">
    import { initApp, showToast, showConfirm } from '../../assets/js/app.js';

    async function loadUsers() {
      const app = await initApp();
      const users = await app.admin.getAllUsers();
      const tbody = document.getElementById('usersTableBody');

      tbody.innerHTML = users.map(u => `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="avatar avatar-sm" style="background:var(--gradient-1);font-size:10px;width:28px;height:28px;">${(u.displayName || '?')[0]}</div>
              <div>
                <div style="font-size:13px;font-weight:500;">${u.displayName || u.username}</div>
                <div style="font-size:11px;color:var(--text-muted);">@${u.username}</div>
              </div>
            </div>
          </td>
          <td>
            ${u.role === 'admin' ? '<span class="badge badge-accent" style="font-size:11px;">Admin</span>' :
              u.role === 'banned' ? '<span class="badge badge-danger" style="font-size:11px;">Banned</span>' :
              u.isCreator ? '<span class="badge badge-success" style="font-size:11px;">Creator</span>' :
              '<span style="font-size:12px;color:var(--text-muted);">User</span>'}
            ${u.isSuperPeer ? '<span class="badge" style="font-size:10px;background:rgba(16,185,129,0.15);color:var(--success);margin-left:4px;">SP</span>' : ''}
          </td>
          <td style="font-size:13px;">${u.credits || 0}</td>
          <td style="font-size:13px;">$${(u.earnings || 0).toFixed(2)}</td>
          <td style="font-size:13px;">${u.followers || 0}</td>
          <td style="font-size:12px;color:var(--text-muted);">${new Date(u.createdAt).toLocaleDateString()}</td>
          <td>
            <div style="display:flex;gap:4px;">
              ${u.role !== 'admin' ? `
                <button class="btn btn-ghost btn-sm ban-btn" data-user-id="${u.id}" data-banned="${u.role === 'banned'}">
                  ${u.role === 'banned' ? 'Unban' : 'Ban'}
                </button>
                ${!u.isCreator ? `
                  <button class="btn btn-ghost btn-sm verify-btn" data-user-id="${u.id}">Verify</button>
                ` : ''}
              ` : ''}
              <a href="../profile.html?id=${u.id}" class="btn btn-ghost btn-sm">View</a>
            </div>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('.ban-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const userId = btn.dataset.userId;
          const isBanned = btn.dataset.banned === 'true';
          const name = btn.closest('tr')?.querySelector('.avatar')?.nextElementSibling?.textContent?.trim() || 'this user';
          const confirmed = await showConfirm(
            isBanned ? `Unban ${name}?` : `Ban ${name}? They won't be able to access their account.`,
            isBanned ? 'Unban' : 'Ban'
          );
          if (!confirmed) return;
          try {
            if (isBanned) {
              await app.admin.unbanUser(userId);
              showToast('User unbanned', 'success');
            } else {
              await app.admin.banUser(userId);
              showToast('User banned', 'info');
            }
            loadUsers();
          } catch (e) {
            showToast(e.message, 'error');
          }
        });
      });

      tbody.querySelectorAll('.verify-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const userId = btn.dataset.userId;
          try {
            await app.admin.verifyCreator(userId);
            showToast('User verified as creator', 'success');
            loadUsers();
          } catch (e) {
            showToast(e.message, 'error');
          }
        });
      });
    }

    await loadUsers();

    document.getElementById('refreshUsers').addEventListener('click', loadUsers);

    document.getElementById('searchUser').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      document.querySelectorAll('#usersTableBody tr').forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(q) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
