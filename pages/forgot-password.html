<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Fannalo</title>
  <meta name="description" content="Reset your Fannalo account password using your security questions.">
  <meta property="og:title" content="Reset Password — Fannalo">
  <meta property="og:description" content="Reset your Fannalo account password using your security questions and OTP verification.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/pages/forgot-password.html">
  <meta property="og:image" content="/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="/pages/forgot-password.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/preload.js"></script>
</head>
<body>
  <div class="bg-noise"></div>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="position:fixed;top:-20%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,255,0.1) 0%,transparent 70%);pointer-events:none;"></div>
    <div style="position:fixed;bottom:-20%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,0.1) 0%,transparent 70%);pointer-events:none;"></div>

    <div class="card" style="max-width:440px;width:100%;padding:32px;">
      <div style="text-align:center;margin-bottom:28px;">
        <a href="../index.html" style="display:inline-block;margin-bottom:8px;"><img src="../assets/img/full_logo.png" alt="Fannalo" style="height:32px;"></a>
        <p style="color:var(--text-secondary);font-size:14px;">Reset your password</p>
      </div>

      <!-- Step 1: Username -->
      <div id="step1">
        <form id="step1Form">
          <div style="margin-bottom:20px;">
            <label class="input-label" for="resetUsername">Username</label>
            <input type="text" id="resetUsername" class="input" placeholder="Enter your username" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:15px;">
            Next — Verify Security Question
          </button>
        </form>
      </div>

      <!-- Step 2: Security Question -->
      <div id="step2" style="display:none;">
        <form id="step2Form">
          <div style="margin-bottom:8px;font-size:13px;color:var(--text-muted);">Your security question:</div>
          <div id="securityQuestionDisplay" style="padding:12px;background:var(--bg-secondary);border-radius:var(--radius-md);margin-bottom:16px;font-size:14px;font-weight:500;"></div>
          <div style="margin-bottom:20px;">
            <label class="input-label" for="securityAnswerInput">Your Answer</label>
            <input type="text" id="securityAnswerInput" class="input" placeholder="Enter your answer" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:15px;">
            Verify Answer
          </button>
        </form>
      </div>

      <!-- Step 3: OTP -->
      <div id="step3" style="display:none;">
        <form id="step3Form">
          <div style="margin-bottom:8px;font-size:13px;color:var(--text-muted);">Enter the OTP sent to your notifications:</div>
          <div style="margin-bottom:20px;">
            <label class="input-label" for="otpInput">One-Time Password</label>
            <input type="text" id="otpInput" class="input" placeholder="000000" maxlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:15px;">
            Verify OTP
          </button>
        </form>
      </div>

      <!-- Step 4: New Password -->
      <div id="step4" style="display:none;">
        <form id="step4Form">
          <div style="margin-bottom:16px;">
            <label class="input-label" for="newPassword">New Password</label>
            <input type="password" id="newPassword" class="input" placeholder="At least 8 characters" required minlength="8">
          </div>
          <div style="margin-bottom:20px;">
            <label class="input-label" for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="input" placeholder="Repeat your password" required minlength="8">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:15px;">
            Reset Password
          </button>
        </form>
      </div>

      <div style="margin-top:20px;text-align:center;font-size:13px;">
        <a href="login.html" style="color:var(--text-muted);">Back to login</a>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script type="module">
    import { initApp } from '../assets/js/app.js';

    let resetUserId = null;
    let resetUsername = null;

    document.getElementById('step1Form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('resetUsername').value.trim();
      try {
        const { db } = await initApp();
        const user = await db.getUserByUsername(username);
        if (!user || !user.securityQuestion) {
          showToast('No security question found for this account', 'error');
          return;
        }
        resetUserId = user.id;
        resetUsername = username;
        document.getElementById('securityQuestionDisplay').textContent = user.securityQuestion;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('step2Form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const answer = document.getElementById('securityAnswerInput').value.trim();
      try {
        const { auth } = await initApp();
        const valid = await auth.verifySecurityQuestion(resetUsername, answer);
        if (!valid) {
          showToast('Incorrect answer', 'error');
          return;
        }
        await auth.generateOTP(resetUserId);
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        showToast('OTP sent to your notifications', 'info');
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('step3Form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('otpInput').value.trim();
      try {
        const { auth } = await initApp();
        const valid = await auth.verifyOTP(resetUserId, otp);
        if (!valid) {
          showToast('Invalid or expired OTP', 'error');
          return;
        }
        document.getElementById('step3').style.display = 'none';
        document.getElementById('step4').style.display = 'block';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('step4Form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      if (newPass !== confirmPass) {
        showToast('Passwords do not match', 'error');
        return;
      }
      try {
        const { auth } = await initApp();
        await auth.resetPassword(resetUsername, newPass);
        showToast('Password reset successfully!', 'success');
        setTimeout(() => window.location.href = 'login.html', 1200);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    function showToast(message, type = 'info', duration = 4000) {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      const colors = { success: 'var(--success)', error: 'var(--danger)', info: 'var(--accent)', warning: 'var(--warning)' };
      t.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;width:100%;">
          <div style="width:8px;height:8px;border-radius:50%;background:${colors[type] || colors.info};flex-shrink:0;"></div>
          <span style="flex:1;font-size:14px;">${message}</span>
          <button onclick="this.closest('.toast').remove()" style="background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;">&times;</button>
        </div>
      `;
      c.appendChild(t);
      setTimeout(() => t.remove(), duration);
    }
  </script>
</body>
</html>
