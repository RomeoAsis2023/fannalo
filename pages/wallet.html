<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet — Fannalo</title>
  <meta name="description" content="Manage your Fannalo credits, top up with PayPal, and view transactions.">
  <meta property="og:title" content="Wallet — Fannalo">
  <meta property="og:description" content="Manage your Fannalo credits, top up with PayPal, and view your transaction history.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/pages/wallet.html">
  <meta property="og:image" content="/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="/pages/wallet.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD" data-sdk-integration-source="button-factory"></script>
</head>
<body>
  <div class="bg-noise"></div>

  <div class="main-content" id="app">
    <div class="container" style="max-width:680px;">
      <h1 style="font-size:22px;font-weight:700;margin-bottom:20px;">Wallet</h1>

      <div class="card" style="padding:28px;margin-bottom:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
          <div>
            <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">Available Balance</div>
            <div id="balanceDisplay" style="font-size:36px;font-weight:800;font-family:var(--font-display);">
              <span class="skeleton" style="display:inline-block;width:120px;height:36px;border-radius:var(--radius-sm);"></span>
            </div>
          </div>
          <div style="display:flex;gap:10px;">
            <button id="topUpBtn" class="btn btn-primary">Top Up</button>
            <button id="sendBtn" class="btn btn-secondary">Send</button>
          </div>
        </div>
      </div>

      <div class="card" style="overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
          <h2 style="font-size:16px;font-weight:600;">Transaction History</h2>
        </div>
        <div id="transactionList" style="padding:16px 20px;">
          <div style="text-align:center;padding:20px;color:var(--text-muted);">Loading transactions...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="modalContainer"></div>
  <div id="toastContainer"></div>

  <script src="../assets/js/core/preload.js"></script>
  <script type="module">
    import { initPage, showToast } from '../assets/js/app.js';

    async function loadWallet(app) {
      const userId = app.auth.currentUser.id;
      const balance = await app.wallet.getBalance(userId);
      document.getElementById('balanceDisplay').textContent = `${app.wallet.formatCredits(balance)} credits`;

      const txs = await app.wallet.getTransactions(userId);
      const list = document.getElementById('transactionList');

      if (!txs || txs.length === 0) {
        list.innerHTML = `
          <div class="empty-state" style="padding:20px;">
            <div class="empty-state-icon">💳</div>
            <p style="color:var(--text-muted);font-size:14px;">No transactions yet. Top up your wallet to get started.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = txs.map(tx => {
        const isCredit = tx.kind === 'credit';
        return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);">
            <div>
              <div style="font-size:14px;font-weight:500;">${tx.description || (isCredit ? 'Top Up' : 'Payment')}</div>
              <div style="font-size:12px;color:var(--text-muted);">${tx.method || tx.kind} · ${new Date(tx.createdAt).toLocaleDateString()}</div>
            </div>
            <div style="font-size:16px;font-weight:700;color:${isCredit ? 'var(--success)' : 'var(--danger)'};">
              ${isCredit ? '+' : '-'}${app.wallet.formatCredits(Math.abs(tx.amount))}
            </div>
          </div>
        `;
      }).join('');
    }

    function openTopUpModal(app) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal" style="max-width:440px;">
          <div class="modal-header">
            <h2 style="font-size:18px;font-weight:600;">Top Up Wallet</h2>
            <button id="closeTopUp" class="btn btn-ghost btn-icon" style="font-size:20px;">&times;</button>
          </div>
          <div class="modal-body">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
              ${[5, 10, 25, 50, 100, 200].map(amt => `
                <button class="amount-btn btn btn-secondary" data-amount="${amt}" style="justify-content:center;padding:14px;">
                  $${amt}
                </button>
              `).join('')}
            </div>
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;">
              <span style="color:var(--text-secondary);font-size:14px;flex-shrink:0;">Custom:</span>
              <input type="number" id="customAmount" class="input" placeholder="Enter amount" min="1" step="0.01" style="flex:1;">
            </div>
            <button id="paypalTopUpBtn" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7.076 21.337H2.47a.642.642 0 0 1-.642-.615L3.76 1.947a.766.766 0 0 1 .768-.685h8.585c3.226 0 5.32 1.486 5.788 4.104.26 1.464.122 2.876-.719 4.002-.987 1.322-2.708 2.09-4.946 2.09h-2.15a.77.77 0 0 0-.77.685l-.785 4.972a.766.766 0 0 1-.764.685h-2.877l-.433 2.737v.003z"/><path d="M19.354 7.574c-.713 3.651-3.045 5.654-6.234 5.654h-2.15a.77.77 0 0 0-.77.685l-1.002 6.359-1.034 6.478a.643.643 0 0 0 .642.717h4.452a.766.766 0 0 0 .765-.685l.89-5.632h2.15c3.19 0 5.52-2.002 6.234-5.654.476-2.436.207-4.088-.743-5.43-.42-.59-.921-1.031-1.48-1.36-.43.27-.92.468-1.452.595-.975.23-2.072.26-3.155.26H12.29l-.288 1.824h2.22c1.745 0 3.142.257 3.132 1.844z" fill-rule="evenodd" clip-rule="evenodd"/></svg>
              Pay with PayPal
            </button>
            <p id="selectedAmount" style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:8px;"></p>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      let selectedAmount = 10;

      overlay.querySelectorAll('.amount-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          overlay.querySelectorAll('.amount-btn').forEach(b => b.className = 'amount-btn btn btn-secondary');
          btn.className = 'amount-btn btn btn-primary';
          selectedAmount = parseInt(btn.dataset.amount);
          document.getElementById('customAmount').value = '';
        });
      });

      document.getElementById('customAmount').addEventListener('input', function() {
        if (this.value) {
          overlay.querySelectorAll('.amount-btn').forEach(b => b.className = 'amount-btn btn btn-secondary');
          selectedAmount = parseFloat(this.value) || 0;
        }
      });

      document.getElementById('closeTopUp').onclick = () => overlay.remove();
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      document.getElementById('paypalTopUpBtn').addEventListener('click', async () => {
        if (selectedAmount <= 0) {
          showToast('Select or enter a valid amount', 'error');
          return;
        }
        try {
          await app.wallet.topUpPayPal(app.auth.currentUser.id, selectedAmount);
          overlay.remove();
          showToast(`Added ${app.wallet.formatCredits(selectedAmount)} credits!`, 'success');
          loadWallet(app);
        } catch (e) {
          showToast(e.message || 'Top up failed', 'error');
        }
      });
    }

    const app = await initPage(true);
    if (app) {
      await loadWallet(app);

      document.getElementById('topUpBtn').addEventListener('click', () => openTopUpModal(app));
      document.getElementById('sendBtn').addEventListener('click', () => {
        showToast('Send credits feature coming in Phase 2', 'info');
      });
    }
  </script>
</body>
</html>
