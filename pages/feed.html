<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — Fannalo</title>
  <meta name="description" content="Browse the latest posts from creators you follow on Fannalo.">
  <meta property="og:title" content="Feed — Fannalo">
  <meta property="og:description" content="Browse the latest posts from creators you follow on the Fannalo P2P network.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://faney.app/pages/feed.html">
  <meta property="og:image" content="https://faney.app/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://faney.app/pages/feed.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <div class="bg-noise"></div>

  <div class="main-content" id="app">
    <div class="container" style="max-width:680px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h1 style="font-size:22px;font-weight:700;">Feed</h1>
        <button id="createPostBtn" class="btn btn-primary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Post
        </button>
      </div>

      <div id="feedContainer">
        <div style="text-align:center;padding:40px;color:var(--text-muted);">
          <div class="skeleton" style="width:100%;height:200px;margin-bottom:16px;border-radius:var(--radius-lg);"></div>
          <div class="skeleton" style="width:80%;height:20px;margin-bottom:12px;border-radius:var(--radius-sm);"></div>
          <div class="skeleton" style="width:60%;height:20px;border-radius:var(--radius-sm);"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="modalContainer"></div>
  <div id="toastContainer"></div>

  <script src="../assets/js/core/preload.js"></script>
  <script type="module">
    import { initPage, showToast } from '../assets/js/app.js';

    async function loadFeed(app) {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Loading feed...</div>';

      try {
        const posts = await app.feed.loadFeed();

        if (!posts || posts.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📰</div>
              <h3 style="color:var(--text-secondary);margin-bottom:8px;">Your feed is empty</h3>
              <p style="color:var(--text-muted);font-size:14px;max-width:300px;">Follow some creators to see their posts here, or create your first post!</p>
              <button id="emptyCreateBtn" class="btn btn-primary" style="margin-top:16px;">Create Your First Post</button>
            </div>
          `;
          document.getElementById('emptyCreateBtn')?.addEventListener('click', openCreateModal);
          return;
        }

        container.innerHTML = '';
        posts.forEach((post, i) => {
          const el = app.feed.renderPost(post);
          el.style.animationDelay = `${i * 0.05}s`;
          container.appendChild(el);
        });

        attachPostListeners(app, container);
      } catch (e) {
        container.innerHTML = `<div class="empty-state"><p style="color:var(--danger);">Failed to load feed: ${e.message}</p></div>`;
      }
    }

    function attachPostListeners(app, container) {
      container.querySelectorAll('.like-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const postId = btn.dataset.postId;
          const liked = await app.feed.toggleLike(postId);
          btn.classList.toggle('liked', liked);
          const countEl = btn.querySelector('.like-count');
          if (countEl) {
            const current = parseInt(countEl.textContent) || 0;
            countEl.textContent = liked ? current + 1 : Math.max(0, current - 1);
          }
          btn.querySelector('svg').setAttribute('fill', liked ? 'currentColor' : 'none');
        });
      });

      container.querySelectorAll('.comment-input').forEach(input => {
        input.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter' && input.value.trim()) {
            const postId = input.dataset.postId;
            await app.feed.addComment(postId, input.value.trim());
            input.value = '';
            showToast('Comment added!', 'success');
          }
        });
      });

      container.querySelectorAll('.share-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const postId = btn.dataset.postId;
          navigator.clipboard.writeText(`${window.location.origin}/pages/feed.html?post=${postId}`);
          showToast('Link copied to clipboard!', 'info');
        });
      });
    }

    function openCreateModal() {
      const existing = document.querySelector('.modal-overlay');
      if (existing) return;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h2 style="font-size:18px;font-weight:600;">Create Post</h2>
            <button id="closeModal" class="btn btn-ghost btn-icon" style="font-size:20px;">&times;</button>
          </div>
          <div class="modal-body">
            <textarea class="textarea" id="postContent" placeholder="What's on your mind?" style="min-height:120px;"></textarea>
            <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
              <button id="addPhotoBtn" class="btn btn-secondary btn-sm">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                Photo
              </button>
              <button id="addVideoBtn" class="btn btn-secondary btn-sm">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                Video
              </button>
              <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;">
                <input type="checkbox" id="isPremiumCheck" style="accent-color:var(--accent);">
                Premium content
              </label>
            </div>
            <div id="premiumPriceField" style="display:none;margin-top:10px;">
              <input type="number" class="input" id="premiumPrice" placeholder="Price in credits" step="0.01" min="0" style="max-width:200px;">
            </div>
            <div id="mediaPreview" style="display:none;margin-top:12px;padding:12px;background:var(--bg-secondary);border-radius:var(--radius-md);"></div>
            <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelModal">Cancel</button>
            <button class="btn btn-primary" id="submitPost">Publish</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      let selectedFile = null;

      document.getElementById('closeModal').onclick = () => overlay.remove();
      document.getElementById('cancelModal').onclick = () => overlay.remove();
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      document.getElementById('isPremiumCheck').addEventListener('change', function() {
        document.getElementById('premiumPriceField').style.display = this.checked ? 'block' : 'none';
      });

      document.getElementById('addPhotoBtn').addEventListener('click', () => {
        const input = document.getElementById('fileInput');
        input.accept = 'image/*';
        input.click();
      });

      document.getElementById('addVideoBtn').addEventListener('click', () => {
        const input = document.getElementById('fileInput');
        input.accept = 'video/*';
        input.click();
      });

      document.getElementById('fileInput').addEventListener('change', (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
          const preview = document.getElementById('mediaPreview');
          preview.style.display = 'block';
          preview.textContent = `📎 ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
        }
      });

      document.getElementById('submitPost').addEventListener('click', async () => {
        const content = document.getElementById('postContent').value.trim();
        if (!content && !selectedFile) {
          showToast('Add some content or media', 'error');
          return;
        }

        const submitBtn = document.getElementById('submitPost');
        submitBtn.textContent = 'Publishing...';
        submitBtn.disabled = true;

        try {
          const { db, p2p, auth, feed, torrent } = await import('../assets/js/app.js').then(m => m.initApp());
          const mediaType = selectedFile?.type.startsWith('video') ? 'video' : selectedFile ? 'image' : 'text';

          const post = await feed.createPost({
            content,
            media: selectedFile ? [selectedFile] : [],
            mediaType,
            isPremium: document.getElementById('isPremiumCheck').checked,
            premiumPrice: parseFloat(document.getElementById('premiumPrice').value) || 0,
            tags: content.match(/#(\w+)/g)?.map(t => t.slice(1)) || []
          });

          overlay.remove();
          showToast('Post published!', 'success');
          loadFeed(await import('../assets/js/app.js').then(m => m.initApp()));
        } catch (e) {
          showToast(e.message || 'Failed to publish', 'error');
          submitBtn.textContent = 'Publish';
          submitBtn.disabled = false;
        }
      });
    }

    const app = await initPage(true);
    if (app) {
      await loadFeed(app);
      document.getElementById('createPostBtn').addEventListener('click', openCreateModal);
    }
  </script>
</body>
</html>
