<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Fannalo</title>
  <meta name="description" content="Join Fannalo — the decentralized creator network. Create your profile and start connecting with fans.">
  <meta property="og:title" content="Sign Up — Fannalo">
  <meta property="og:description" content="Join the decentralized creator network. Create your profile and start connecting with fans directly.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/pages/register.html">
  <meta property="og:image" content="/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="/pages/register.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/preload.js"></script>
</head>
<body>
  <div class="bg-noise"></div>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="position:fixed;top:-20%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,255,0.1) 0%,transparent 70%);pointer-events:none;"></div>
    <div style="position:fixed;bottom:-20%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,0.1) 0%,transparent 70%);pointer-events:none;"></div>

    <div class="card" style="max-width:480px;width:100%;padding:32px;">
      <div style="text-align:center;margin-bottom:28px;">
        <a href="../index.html" style="display:inline-block;margin-bottom:8px;"><img src="../assets/img/full_logo.png" alt="Fannalo" style="height:32px;"></a>
        <p style="color:var(--text-secondary);font-size:14px;">Join the decentralized creator network</p>
      </div>

      <form id="registerForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
          <div>
            <label class="input-label" for="displayName">Display Name</label>
            <input type="text" id="displayName" class="input" placeholder="Your name">
          </div>
          <div>
            <label class="input-label" for="username">Username *</label>
            <input type="text" id="username" class="input" placeholder="Choose a username" required pattern="[a-zA-Z0-9_]+" minlength="3">
          </div>
        </div>
        <div style="margin-bottom:16px;">
          <label class="input-label" for="email">Email</label>
          <input type="email" id="email" class="input" placeholder="your@email.com">
        </div>
        <div style="margin-bottom:16px;">
          <label class="input-label" for="password">Password *</label>
          <input type="password" id="password" class="input" placeholder="At least 8 characters" required minlength="8">
        </div>
        <div style="margin-bottom:16px;">
          <label class="input-label" for="securityQuestion">Security Question</label>
          <select id="securityQuestion" class="input">
            <option value="">— Select a question —</option>
            <option value="pet">What was your first pet's name?</option>
            <option value="city">What city were you born in?</option>
            <option value="school">What was your elementary school?</option>
            <option value="movie">What's your favorite movie?</option>
            <option value="food">What's your favorite food?</option>
          </select>
        </div>
        <div style="margin-bottom:16px;">
          <label class="input-label" for="securityAnswer">Security Answer</label>
          <input type="text" id="securityAnswer" class="input" placeholder="Your answer">
        </div>
        <div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">
          <input type="checkbox" id="isCreator" style="accent-color:var(--accent);width:18px;height:18px;">
          <label for="isCreator" style="font-size:14px;color:var(--text-secondary);cursor:pointer;">I'm a creator — set up subscription pricing</label>
        </div>
        <div id="creatorPriceField" style="display:none;margin-bottom:16px;">
          <label class="input-label" for="subscriptionPrice">Monthly Subscription Price (credits)</label>
          <input type="number" id="subscriptionPrice" class="input" placeholder="0" min="0" step="0.01">
        </div>
        <div style="margin-bottom:20px;display:flex;align-items:center;gap:10px;">
          <input type="checkbox" id="usePasskey" style="accent-color:var(--accent);width:18px;height:18px;">
          <label for="usePasskey" style="font-size:14px;color:var(--text-secondary);cursor:pointer;">Set up passkey for secure login</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:15px;">
          Create Account
        </button>
      </form>

      <div style="margin-top:20px;text-align:center;font-size:13px;">
        <span style="color:var(--text-muted);">Already have an account?</span>
        <a href="login.html" style="color:var(--accent);">Log in</a>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script type="module">
    import { initApp } from '../assets/js/app.js';

    document.getElementById('isCreator').addEventListener('change', function() {
      document.getElementById('creatorPriceField').style.display = this.checked ? 'block' : 'none';
    });

    function validate() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const sq = document.getElementById('securityQuestion').value;
      const sa = document.getElementById('securityAnswer').value.trim();
      if (!username) { showToast('Choose a username', 'error'); return false; }
      if (username.length < 3) { showToast('Username must be at least 3 characters', 'error'); return false; }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) { showToast('Username can only contain letters, numbers, and underscores', 'error'); return false; }
      if (!password) { showToast('Create a password', 'error'); return false; }
      if (password.length < 8) { showToast('Password must be at least 8 characters', 'error'); return false; }
      if (sq && !sa) { showToast('Enter your security answer', 'error'); return false; }
      return true;
    }

    async function handleRegister(e) {
      e.preventDefault();
      if (!validate()) return;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const orig = submitBtn.innerHTML;
      submitBtn.innerHTML = 'Creating account...'; submitBtn.disabled = true;

      try {
        const { auth } = await initApp();
        const user = await auth.register({
          username: document.getElementById('username').value.trim(),
          displayName: document.getElementById('displayName').value.trim() || document.getElementById('username').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          securityQuestion: document.getElementById('securityQuestion').value,
          securityAnswer: document.getElementById('securityAnswer').value.trim(),
          isCreator: document.getElementById('isCreator').checked,
          subscriptionPrice: parseFloat(document.getElementById('subscriptionPrice').value) || 0,
          usePasskey: document.getElementById('usePasskey').checked
        });
        showToast(`Welcome, ${user.displayName}!`, 'success');
        setTimeout(() => window.location.href = 'feed.html', 1000);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        submitBtn.innerHTML = orig; submitBtn.disabled = false;
      }
    }

    document.getElementById('registerForm').addEventListener('submit', handleRegister);

    function showToast(message, type = 'info', duration = 4000) {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      const colors = { success: 'var(--success)', error: 'var(--danger)', info: 'var(--accent)', warning: 'var(--warning)' };
      t.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;width:100%;">
          <div style="width:8px;height:8px;border-radius:50%;background:${colors[type] || colors.info};flex-shrink:0;"></div>
          <span style="flex:1;font-size:14px;">${message}</span>
          <button onclick="this.closest('.toast').remove()" style="background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;">&times;</button>
        </div>
      `;
      c.appendChild(t);
      setTimeout(() => t.remove(), duration);
    }
  </script>
</body>
</html>
