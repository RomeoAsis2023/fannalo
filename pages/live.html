<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Live — Fannalo</title>
  <meta name="description" content="Start a live stream to your fans on the Fannalo P2P network.">
  <meta property="og:title" content="Go Live — Fannalo">
  <meta property="og:description" content="Start a live stream to your fans on the Fannalo P2P network using WebTorrent.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://faney.app/pages/live.html">
  <meta property="og:image" content="https://faney.app/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://faney.app/pages/live.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/preload.js"></script>
</head>
<body>
  <div class="bg-noise"></div>

  <div class="main-content" id="app">
    <div class="container" style="max-width:800px;">
      <div id="goLiveSection">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
          <h1 style="font-size:22px;font-weight:700;">Go Live</h1>
        </div>

        <div class="card" style="padding:24px;margin-bottom:20px;">
          <div style="display:flex;gap:16px;flex-wrap:wrap;">
            <div style="flex:1;min-width:280px;">
              <label style="font-size:13px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:6px;">Stream Title</label>
              <input type="text" id="streamTitle" class="input" placeholder="What are you streaming?" style="margin-bottom:12px;">
              <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;">
                <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;">
                  <input type="checkbox" id="premiumStream" style="accent-color:var(--accent);"> Premium stream
                </label>
              </div>
              <div id="premiumPriceField" style="display:none;margin-bottom:12px;">
                <input type="number" class="input" id="streamPrice" placeholder="Price (credits)" min="0" step="0.5" style="max-width:150px;">
              </div>
              <button id="startStreamBtn" class="btn btn-danger btn-lg" style="width:100%;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                Go Live
              </button>
            </div>
            <div style="width:320px;height:240px;background:var(--bg-secondary);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;overflow:hidden;">
              <video id="livePreview" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1);"></video>
              <div id="previewPlaceholder" style="text-align:center;color:var(--text-muted);font-size:13px;">
                <div style="font-size:32px;margin-bottom:8px;">📹</div>
                Preview will appear here
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="liveStreamSection" style="display:none;">
        <div style="position:relative;background:#000;border-radius:var(--radius-xl);overflow:hidden;margin-bottom:16px;">
          <video id="liveVideo" autoplay playsinline style="width:100%;max-height:500px;object-fit:contain;transform:scaleX(-1);"></video>
          <div style="position:absolute;top:16px;left:16px;display:flex;gap:8px;align-items:center;">
            <span style="display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(239,68,68,0.9);border-radius:9999px;font-size:12px;font-weight:600;color:#fff;">
              <span style="width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite;"></span>
              LIVE
            </span>
            <span id="liveViewerCount" style="padding:6px 12px;background:rgba(0,0,0,0.6);border-radius:9999px;font-size:12px;color:var(--text-secondary);">0 watching</span>
          </div>
          <div style="position:absolute;top:16px;right:16px;">
            <button id="endStreamBtn" class="btn btn-danger btn-sm">End Stream</button>
          </div>
        </div>

        <div class="card" style="overflow:hidden;">
          <div style="padding:12px 16px;border-bottom:1px solid var(--border);">
            <h3 style="font-size:14px;font-weight:600;">Live Chat</h3>
          </div>
          <div id="liveChatMessages" style="height:200px;overflow-y:auto;padding:12px 16px;"></div>
          <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;">
            <input type="text" id="liveChatInput" class="input" placeholder="Send a message..." style="flex:1;padding:8px 14px;font-size:13px;">
            <button id="liveChatSend" class="btn btn-primary btn-sm">Send</button>
          </div>
        </div>
      </div>

      <div id="activeStreams" style="margin-top:32px;">
        <h2 style="font-size:18px;font-weight:600;margin-bottom:16px;">Active Streams</h2>
        <div id="streamList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
          <div style="text-align:center;padding:40px;color:var(--text-muted);">No active streams</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script type="module">
    import { initPage, showToast, showConfirm } from '../assets/js/app.js';

    let app = null;

    async function startStream() {
      const title = document.getElementById('streamTitle').value.trim();
      if (!title) { showToast('Enter a stream title', 'error'); return; }

      const isPremium = document.getElementById('premiumStream').checked;
      const price = parseFloat(document.getElementById('streamPrice').value) || 0;

      try {
        const stream = await app.live.startStream(title, isPremium, price);
        document.getElementById('livePreview').srcObject = app.live.stream;
        document.getElementById('liveVideo').srcObject = app.live.stream;
        document.getElementById('livePreview').style.display = 'block';
        document.getElementById('previewPlaceholder').style.display = 'none';
        document.getElementById('goLiveSection').style.display = 'none';
        document.getElementById('liveStreamSection').style.display = 'block';
        showToast('You are live!', 'success');
      } catch (e) {
        showToast(e.message || 'Failed to start stream', 'error');
      }
    }

    async function endStream() {
      const ok = await showConfirm('End your live stream?', 'End Stream');
      if (!ok) return;
      try {
        const recording = await app.live.saveRecording();
        await app.live.endStream();
        document.getElementById('goLiveSection').style.display = 'block';
        document.getElementById('liveStreamSection').style.display = 'none';
        showToast(recording ? 'Stream ended. Recording saved!' : 'Stream ended', 'info');
      } catch (e) {
        showToast(e.message || 'Failed to end stream', 'error');
      }
    }

    app = await initPage(true);
    if (app) {
      document.getElementById('startStreamBtn').addEventListener('click', startStream);
      document.getElementById('endStreamBtn').addEventListener('click', endStream);

      document.getElementById('premiumStream').addEventListener('change', function() {
        document.getElementById('premiumPriceField').style.display = this.checked ? 'block' : 'none';
      });

      document.getElementById('liveChatSend').addEventListener('click', async () => {
        const input = document.getElementById('liveChatInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        const msg = await app.live.sendChat(text);
        const chatDiv = document.createElement('div');
        chatDiv.style.cssText = 'padding:6px 0;font-size:13px;';
        chatDiv.innerHTML = `<strong style="color:var(--accent);">${msg.displayName}:</strong> ${msg.message}`;
        document.getElementById('liveChatMessages').appendChild(chatDiv);
      });

      document.getElementById('liveChatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('liveChatSend').click();
      });
    }
  </script>
</body>
</html>
