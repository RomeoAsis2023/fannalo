<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Fannalo</title>
  <meta name="description" content="Track your Fannalo creator performance with real-time analytics.">
  <meta property="og:title" content="Analytics — Fannalo">
  <meta property="og:description" content="Track your Fannalo creator performance with real-time P2P analytics and charts.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/pages/analytics.html">
  <meta property="og:image" content="/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="/pages/analytics.html">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <link rel="apple-touch-icon" href="../assets/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/preload.js"></script>
</head>
<body>
  <div class="bg-noise"></div>

  <div class="main-content" id="app">
    <div class="container" style="max-width:900px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <h1 style="font-size:22px;font-weight:700;">Analytics</h1>
        <div style="display:flex;gap:10px;align-items:center;">
          <span id="realtimeIndicator" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);">
            <span style="width:6px;height:6px;border-radius:50%;background:var(--success);"></span> Live
          </span>
          <button id="refreshAnalytics" class="btn btn-secondary btn-sm">Refresh</button>
        </div>
      </div>

      <div id="realtimeBar" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
        <div class="stat-card"><div class="stat-value" id="livePeers">0</div><div class="stat-label">Peers Connected</div></div>
        <div class="stat-card"><div class="stat-value" id="liveUsers">0</div><div class="stat-label">Active Users</div></div>
        <div class="stat-card"><div class="stat-value" id="livePosts">0</div><div class="stat-label">Posts Today</div></div>
        <div class="stat-card"><div class="stat-value" id="liveRevenue">$0</div><div class="stat-label">Revenue Today</div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">
        <div class="card" style="padding:20px;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;">Posts (Last 7 Days)</h3>
          <div id="postsChart"></div>
        </div>
        <div class="card" style="padding:20px;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;">New Users (Last 7 Days)</h3>
          <div id="usersChart"></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">
        <div class="card" style="padding:20px;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;">Revenue (Last 7 Days)</h3>
          <div id="revenueChart"></div>
        </div>
        <div class="card" style="padding:20px;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;">Growth Trends</h3>
          <div id="growthStats">
            <div class="stat-card" style="margin-bottom:8px;">
              <div class="stat-value" id="userGrowth" style="font-size:20px;">0%</div>
              <div class="stat-label">User Growth (7d)</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="postGrowth" style="font-size:20px;">0%</div>
              <div class="stat-label">Post Growth (7d)</div>
            </div>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="card" style="overflow:hidden;">
          <div style="padding:14px 20px;border-bottom:1px solid var(--border);">
            <h3 style="font-size:14px;font-weight:600;">Top Posts</h3>
          </div>
          <div id="topPosts" style="padding:0;">
            <div style="text-align:center;padding:20px;color:var(--text-muted);">Loading...</div>
          </div>
        </div>
        <div class="card" style="overflow:hidden;">
          <div style="padding:14px 20px;border-bottom:1px solid var(--border);">
            <h3 style="font-size:14px;font-weight:600;">Top Creators</h3>
          </div>
          <div id="topCreators" style="padding:0;">
            <div style="text-align:center;padding:20px;color:var(--text-muted);">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initPage } from '../assets/js/app.js';

    let app = null;

    async function loadAnalytics() {
      const data = await app.analytics.getDashboard();

      const rt = app.analytics.getRealtimeStats();
      document.getElementById('livePeers').textContent = rt.peers;
      document.getElementById('liveUsers').textContent = rt.activeUsers;
      document.getElementById('livePosts').textContent = data.trends.recentPosts;
      document.getElementById('liveRevenue').textContent = '$' + (data.trends.revenue24h || 0).toFixed(2);

      document.getElementById('userGrowth').textContent = data.trends.userGrowth + '%';
      document.getElementById('userGrowth').style.color = data.trends.userGrowth >= 0 ? 'var(--success)' : 'var(--danger)';
      document.getElementById('postGrowth').textContent = data.trends.postGrowth + '%';
      document.getElementById('postGrowth').style.color = data.trends.postGrowth >= 0 ? 'var(--success)' : 'var(--danger)';

      if (data.charts.postsByDay) {
        document.getElementById('postsChart').innerHTML = app.analytics.renderChart(data.charts.postsByDay, 'day', 'count', 'var(--accent)');
      }
      if (data.charts.usersByDay) {
        document.getElementById('usersChart').innerHTML = app.analytics.renderChart(data.charts.usersByDay, 'day', 'count', 'var(--accent-secondary)');
      }
      if (data.charts.revenueByDay) {
        document.getElementById('revenueChart').innerHTML = app.analytics.renderChart(data.charts.revenueByDay, 'day', 'count', 'var(--success)');
      }

      const topPostsContainer = document.getElementById('topPosts');
      if (data.topContent.length > 0) {
        topPostsContainer.innerHTML = data.topContent.map(p => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);font-size:13px;">
            <span style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.content?.substring(0, 50) || '(media)'}</span>
            <span>❤️ ${p.likes || 0}</span>
          </div>
        `).join('');
      } else {
        topPostsContainer.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">No posts yet</div>';
      }

      const topCreatorsContainer = document.getElementById('topCreators');
      if (data.topCreators.length > 0) {
        topCreatorsContainer.innerHTML = data.topCreators.map(u => `
          <div style="display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);">
            <div class="avatar avatar-sm" style="background:var(--gradient-1);font-size:10px;width:24px;height:24px;">${(u.displayName || '?')[0]}</div>
            <div style="flex:1;font-size:13px;">${u.displayName || u.username}</div>
            <span style="font-size:12px;font-weight:600;color:var(--success);">$${(u.earnings || 0).toFixed(2)}</span>
          </div>
        `).join('');
      } else {
        topCreatorsContainer.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">No creators yet</div>';
      }
    }

    app = await initPage(true);
    if (app) {
      await loadAnalytics();
      document.getElementById('refreshAnalytics').addEventListener('click', loadAnalytics);

      app.analytics.on('update', (rt) => {
        document.getElementById('livePeers').textContent = rt.peers;
        document.getElementById('liveUsers').textContent = rt.activeUsers;
      });
    }
  </script>
</body>
</html>
